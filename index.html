<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A cozy gardening game on a tiny floating island." />
    <meta name="theme-color" content="#F6E9D7" />
    <title>Tiny Isle</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="app">
      <canvas
        id="scene"
        aria-label="Your island. Click a garden patch to use the selected tool."
      ></canvas>
      <div id="ui"></div>
    </main>
    <noscript>Tiny Isle needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
