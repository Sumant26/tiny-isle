name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Till a patch
        2. Plant a carrot
        3. ...
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Windows 11
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console errors or save file
      description: Settings → Export gives you a save file you can attach.
