name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-baselines:
    name: Generate and commit visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Update visual snapshot baselines
        run: npx playwright test --project=visual --update-snapshots

      - name: Commit and push baseline screenshots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__/
          if git diff --staged --quiet; then
            echo "No visual baseline changes detected."
          else
            git commit -m "chore(test): update visual baselines"
            git push
          fi
